spring.application.name=skillnapse
spring.config.import=optional:file:.env[.properties]

# Configurações de Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skillnapse}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configurações do Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Configurações de IA (BYOK - Bring Your Own Key)
skillnapse.ai.provider=${AI_PROVIDER:gemini}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-flash-latest}
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-openai-key}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}